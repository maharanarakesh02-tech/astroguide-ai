<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Video Studio</title><style>body{margin:0;font-family:Arial;background:#09090b;color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#18181b;border:1px solid #303036;border-radius:20px;padding:20px;margin:16px 0}textarea,input,select,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #3f3f46;background:#0f0f12;color:#fff;margin-top:8px}button{background:#f4c95d;color:#17130a;font-weight:bold;cursor:pointer}canvas{width:100%;border-radius:18px;background:#111;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{color:#a1a1aa;font-size:14px}#status{min-height:24px;color:#f4c95d}</style><body><div class="wrap"><h1>🎬 Free Video Studio</h1><p class="small">Create a simple narrated video in your browser. No paid API required for this version.</p><div class="card"><label>Topic or script</label><textarea id="script" rows="7" placeholder="Example: 5 facts about Mars...">Welcome to this video. Today we explore an interesting idea. Stay with us to discover something useful.</textarea><div class="row"><div><label>Voice</label><select id="voice"></select></div><div><label>Duration per scene</label><select id="seconds"><option value="3">3 seconds</option><option value="5" selected>5 seconds</option><option value="7">7 seconds</option></select></div></div><button id="make">Generate Video Preview</button><button id="record">Record & Download WebM</button><div id="status"></div><canvas id="canvas" width="1280" height="720"></canvas></div></div><script>const $=x=>document.getElementById(x),c=$('canvas'),ctx=c.getContext('2d');let scenes=[],timer,rec;function voices(){let v=speechSynthesis.getVoices();$('voice').innerHTML=v.map((x,i)=>`<option value="${i}">${x.name} — ${x.lang}</option>`).join('')}speechSynthesis.onvoiceschanged=voices;voices();function split(t){return t.split(/[.!?]\s+/).map(x=>x.trim()).filter(Boolean).slice(0,12)}function draw(text,i){let g=ctx.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,['#25124b','#12395b','#4b1628'][i%3]);g.addColorStop(1,'#09090b');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#f4c95d';ctx.font='bold 42px Arial';ctx.fillText('FREE VIDEO STUDIO',60,75);ctx.fillStyle='white';ctx.font='bold 62px Arial';let words=text.split(' '),lines=[],line='';words.forEach(w=>{let n=line?line+' '+w:w;if(ctx.measureText(n).width>1100){lines.push(line);line=w}else line=n});lines.push(line);lines.forEach((l,j)=>ctx.fillText(l,70,260+j*82));ctx.fillStyle='#c4c4cc';ctx.font='30px Arial';ctx.fillText('Scene '+(i+1)+' / '+scenes.length,70,650)}function speak(text){speechSynthesis.cancel();let v=speechSynthesis.getVoices(),u=new SpeechSynthesisUtterance(text);u.voice=v[$('voice').value]||null;u.rate=.95;speechSynthesis.speak(u)}function run(){clearInterval(timer);let i=0,d=+$('seconds').value*1000;draw(scenes[0],0);speak(scenes[0]);timer=setInterval(()=>{i++;if(i>=scenes.length){clearInterval(timer);$('status').textContent='Preview complete.';return}draw(scenes[i],i);speak(scenes[i])},d)}$('make').onclick=()=>{scenes=split($('script').value);if(!scenes.length){$('status').textContent='Enter a script first.';return}$('status').textContent='Generating browser video preview…';run()};$('record').onclick=()=>{if(!scenes.length){$('make').click();setTimeout(()=>$('record').click(),300);return}if(rec&&rec.state==='recording')return;let stream=c.captureStream(30),chunks=[];rec=new MediaRecorder(stream,{mimeType:'video/webm'});rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='video-studio.webm';a.click();$('status').textContent='Video saved.'};rec.start();$('status').textContent='Recording video…';let total=scenes.length*(+$('seconds').value)*1000;setTimeout(()=>rec.stop(),total);run()}</script></body></html>
