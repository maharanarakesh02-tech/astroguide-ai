<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AstroGuide AI</title><style>
:root{--bg:#07050f;--panel:#110c20;--line:#312344;--gold:#f1c96b;--muted:#b8afc7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 0,#3a245c,transparent 30%),radial-gradient(circle at 95% 20%,#123e59,transparent 28%),var(--bg)}.wrap{max-width:900px;margin:auto;padding:0 20px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900}.gold{color:var(--gold)}.hero{padding:70px 0 50px}.eyebrow{color:var(--gold);font-size:12px;font-weight:bold;letter-spacing:2px}.hero h1{font-size:clamp(48px,8vw,82px);line-height:.95;margin:18px 0}.lead{font-size:18px;color:var(--muted);line-height:1.7}.section{padding:50px 0}.form{background:linear-gradient(145deg,#181126,#0f0a1a);border:1px solid var(--line);border-radius:22px;padding:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:13px 0 6px;color:#ddd}input,select{width:100%;padding:15px;border-radius:12px;border:1px solid #403150;background:#090611;color:white;font-size:16px}.btn{margin-top:20px;border:0;border-radius:14px;padding:15px 22px;background:var(--gold);color:#17111d;font-weight:bold;font-size:16px;cursor:pointer}.result{display:none;margin-top:20px;padding:22px;border-radius:16px;background:#21162f;border:1px solid #58406f;line-height:1.7}.error{color:#ffb4b4}@media(max-width:600px){.row{grid-template-columns:1fr}.hero{padding-top:40px}}
</style></head><body><div class="wrap"><nav class="nav"><div class="logo">✦ ASTRO<span class="gold">GUIDE</span> AI</div><div class="gold">Free Reading</div></nav><section class="hero"><div class="eyebrow">PERSONALIZED ASTROLOGY • AI-POWERED</div><h1>Find clarity in your <span class="gold">stars.</span></h1><p class="lead">Enter your complete birth details for a more personalized reflection.</p></section><section class="section"><h2>Your birth details</h2><form class="form" id="f"><label>Your name</label><input id="name" required placeholder="Enter your name"><div class="row"><div><label>Date of birth</label><input id="dob" type="date" required></div><div><label>Time of birth</label><input id="time" type="time" required></div></div><label>Birthplace / location</label><input id="location" required placeholder="City, State, Country"><label>What do you want clarity on?</label><select id="topic"><option>Career & purpose</option><option>Love & relationships</option><option>Personal growth</option></select><button class="btn" id="submit" type="submit">Generate My Reading ✦</button><div class="result" id="result"></div></form></section></div><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),r=document.getElementById('result');b.disabled=true;b.textContent='Creating your reading…';r.style.display='block';r.textContent='Reading your birth details…';try{const x=await fetch('/api/reading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,dob:document.getElementById('dob').value,time:document.getElementById('time').value,location:document.getElementById('location').value,topic:document.getElementById('topic').value})});const d=await x.json();if(!x.ok)throw new Error(d.error||'Request failed');r.className='result';r.innerHTML='<strong>✦ Your personalized insight</strong><br><br>'+d.reading+'<br><br><small>'+d.birthSummary+'<br>'+d.disclaimer+'</small>'}catch(err){r.className='result error';r.textContent=err.message||'Unable to generate reading. Please try again.'}finally{b.disabled=false;b.textContent='Generate My Reading ✦'}});</script></body></html>
