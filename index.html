<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AstroGuide AI</title><style>
:root{--bg:#07050f;--panel:#110c20;--line:#312344;--gold:#f1c96b;--muted:#b8afc7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 0,#3a245c,transparent 30%),var(--bg)}.wrap{max-width:900px;margin:auto;padding:0 20px}.nav{height:70px;display:flex;justify-content:space-between;align-items:center}.gold{color:var(--gold)}.hero{padding:48px 0 24px}.hero h1{font-size:clamp(42px,8vw,72px);margin:12px 0}.lead{color:var(--muted);font-size:17px;line-height:1.6}.card{background:linear-gradient(145deg,#181126,#0f0a1a);border:1px solid var(--line);border-radius:22px;padding:25px;margin:25px 0 50px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 6px}input,select{width:100%;padding:15px;border-radius:12px;border:1px solid #403150;background:#090611;color:white;font-size:16px}.btn{margin-top:20px;border:0;border-radius:14px;padding:15px 22px;background:var(--gold);font-weight:bold;font-size:16px}.result{display:none;margin-top:20px;padding:20px;border:1px solid #58406f;border-radius:16px;line-height:1.65}.planet{display:inline-block;margin:4px;padding:7px 10px;border:1px solid #58406f;border-radius:999px;color:var(--gold)}small{color:var(--muted)}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><nav class="nav"><b>✦ ASTRO<span class="gold">GUIDE</span> AI</b><span class="gold">Free Chart Reading</span></nav><section class="hero"><div class="gold">TRANSPARENT • PERSONALIZED • FREE</div><h1>Your birth details, <span class="gold">your reading.</span></h1><p class="lead">We calculate planetary positions and clearly separate chart data from traditional interpretation.</p></section><main class="card"><form id="f"><label>Name</label><input id="name" required placeholder="Enter your name"><div class="row"><div><label>Date of birth</label><input id="dob" type="date" required></div><div><label>Time of birth</label><input id="time" type="time" required></div></div><label>Birthplace / location</label><input id="location" required placeholder="City, State, Country"><label>What do you want clarity on?</label><select id="topic"><option>Career & purpose</option><option>Love & relationships</option><option>Personal growth</option></select><button class="btn" id="submit" type="submit">Generate My Reading ✦</button></form><section class="result" id="result"></section></main></div><script>
const f=document.getElementById('f'),b=document.getElementById('submit'),r=document.getElementById('result');
f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Calculating…';r.style.display='block';r.textContent='Calculating your chart…';try{const x=await fetch('/api/reading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,dob:document.getElementById('dob').value,time:document.getElementById('time').value,location:document.getElementById('location').value,topic:document.getElementById('topic').value})});const d=await x.json();if(!x.ok)throw new Error(d.error||'Unable to generate reading');const planets=(d.chart.planets||[]).map(p=>'<span class="planet">'+p.name+': '+p.sign+' '+p.degree+'°</span>').join('');const systems=(d.systems||[]).map(s=>'<p><b>'+s.name+'</b><br>'+s.insight+'</p>').join('');r.innerHTML='<h2>✦ Your Personalized Reading</h2><p>'+d.reading+'</p><h3>Calculated planetary positions</h3><div>'+planets+'</div><h3>How this reading is structured</h3>'+systems+'<p><small>'+d.disclaimer+'</small></p>'}catch(err){r.innerHTML='<b>Unable to generate reading</b><p>'+err.message+'</p>'}finally{b.disabled=false;b.textContent='Generate My Reading ✦'}});
</script></body></html>
