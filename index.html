<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstroGuide AI</title></head><body style="margin:0;font-family:Arial;background:#090613;color:white"><main style="max-width:760px;margin:auto;padding:40px 20px"><h1>✦ ASTROGUIDE AI</h1><p>Personalized astrology for reflection.</p><form id="f"><input id="name" placeholder="Your name" required style="width:100%;padding:14px;margin:8px 0"><input id="dob" type="date" required style="width:100%;padding:14px;margin:8px 0"><select id="topic" style="width:100%;padding:14px;margin:8px 0"><option>Career & purpose</option><option>Love & relationships</option><option>Personal growth</option></select><button style="padding:14px 20px">Get Reading</button></form><div id="r" style="display:none;margin-top:20px;padding:20px;background:#20162d"></div><p><small>For entertainment and personal reflection only.</small></p></main><script>f.onsubmit=async e=>{e.preventDefault();r.style.display='block';r.textContent='Creating your reading...';try{let x=await fetch('/api/reading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,topic:topic.value,dob:dob.value})});let d=await x.json();r.innerHTML='<b>Your insight</b><br><br>'+d.reading+'<br><br><small>'+d.disclaimer+'</small>'}catch(err){r.textContent='Unable to create reading right now. Please try again.'}}</script></body></html>
